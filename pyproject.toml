[project]
name = "testtask"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "celery>=5.6.3",
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn>=0.54.0",
]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # warnings
    "I",   # import sorting (isort)
    "N",   # naming (pep8-naming)

    "UP",  # pyupgrade
    "B",   # bugbear (ловит реальные баги)
    "C4",  # comprehensions
    "SIM", # упрощения кода

    "ARG", # неиспользуемые аргументы
    "RET", # return-антипаттерны
    "PTH", # pathlib вместо os.path

    "RUF", # собственные правила ruff
    "TC",  # type-checking imports
]
ignore = [
    "E501",   # длина строки (пусть formatter решает)
    "RUF003", # русские и английские буквы
    "RUF002", # русские и английские буквы
]
fixable = ["ALL"]
unfixable = []

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "shared.infrastructure.database.base.Base",
]

[tool.ruff.lint.per-file-ignores]
"services/*/infrastructure/api/controllers/*.py" = ["TC001", "TC002", "TC003"]
