[project]
name = "testtask"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[tool.mypy]
python_version = "3.14"
strict = true

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # warnings
    "I",   # import sorting (isort)
    "N",   # naming (pep8-naming)

    "UP",  # pyupgrade
    "B",   # bugbear (ловит реальные баги)
    "C4",  # comprehensions
    "SIM", # упрощения кода

    "ARG", # неиспользуемые аргументы
    "RET", # return-антипаттерны
    "PTH", # pathlib вместо os.path

    "RUF", # собственные правила ruff
    "TC",  # type-checking imports
]
ignore = [
    "E501",   # длина строки (пусть formatter решает)
    "RUF003", # русские и английские буквы
    "RUF002", # русские и английские буквы
]
fixable = ["ALL"]
unfixable = []

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.17.0",
]
